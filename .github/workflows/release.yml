# Terraform Provider release workflow
#
# Fires on push of a signed `v*` tag. Runs GoReleaser which cross-compiles
# the provider for every OS/arch the Registry ships, signs artefacts with
# GPG, and creates a GitHub release that the Terraform Registry indexes
# automatically.
#
# One-time operator setup (per operator flow at
# https://developer.hashicorp.com/terraform/registry/providers/publishing):
#   1. Reserve `figentra` namespace on registry.terraform.io
#   2. Generate GPG key + register public key with the Registry namespace
#   3. Add GPG_PRIVATE_KEY + PASSPHRASE as GitHub Actions secrets
#      (Repo settings → Secrets and variables → Actions → New repository secret)
#   4. Push signed tag: `git tag -s v0.2.0 -m "..."` && `git push origin v0.2.0`
#
# Every subsequent release: push a new signed tag. Workflow does the rest.

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # GoReleaser needs full history for changelog generation.
          fetch-depth: 0

      - name: Unshallow
        run: git fetch --prune --unshallow

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
