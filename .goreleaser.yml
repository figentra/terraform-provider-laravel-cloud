# GoReleaser config — Terraform Provider for Laravel Cloud
#
# Shape mirrors HashiCorp's canonical provider release template at
# https://github.com/hashicorp/terraform-provider-scaffolding-framework/blob/main/.goreleaser.yml
#
# CI (release.yml) fires this on git tag push. The workflow:
#   1. Import GPG signing key from CI secret
#   2. Run `goreleaser release --clean`
#   3. GoReleaser cross-compiles binaries for Linux/macOS/Windows × amd64/arm64
#   4. Each binary is zipped, SHA256-checksummed, and GPG-signed
#   5. GitHub release is created with every artefact attached
#   6. Registry pulls the release + verifies signatures
#
# Every release requires:
#   - A signed git tag matching semver (v0.1.0)
#   - GPG_PRIVATE_KEY + PASSPHRASE in CI secrets
#   - The GPG public key registered with Terraform Registry (one-time setup)

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      # Provider binaries must be static — CGO breaks cross-compilation.
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      # Stamp the version into main.go via ldflag.
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }}
    goos:
      - freebsd
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - "386"
      - arm
      - arm64
    ignore:
      # Terraform Registry doesn't ship for these targets.
      - goos: darwin
        goarch: "386"
      - goos: darwin
        goarch: arm
    binary: "{{ .ProjectName }}_v{{ .Version }}"

archives:
  - formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  extra_files:
    - glob: "terraform-registry-manifest.json"
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256

signs:
  - artifacts: checksum
    args:
      # HashiCorp's canonical GPG signing invocation for Registry.
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

release:
  extra_files:
    - glob: "terraform-registry-manifest.json"
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"
  # Draft = false so the release is published immediately; Registry
  # polls for new releases on the OSS org.

changelog:
  disable: true
